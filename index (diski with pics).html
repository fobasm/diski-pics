<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diski Game</title>
<meta name="description" content="Diski Game — a South African football career mode. Manage Bright PMB FC or any PSL side, from the Betway Premiership down to the regional leagues.">
<meta name="theme-color" content="#170a26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0607;--bg2:#070303;--panel:rgba(32,11,13,.85);--panel2:rgba(46,14,16,.9);--raise:rgba(64,18,20,.94);--line:rgba(210,30,40,.35);--ink:#f7efe9;--mute:#b79a98;--gold:#ffcc33;--orange:#ff5a3c;--gold-d:#a34e00;--red:#e0142f;--blue:#4fd0ff;--good:#39ff8c;--f-head:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--glowY:0 0 6px rgba(255,204,51,.85),0 0 16px rgba(255,204,51,.5),0 0 34px rgba(224,20,47,.35);--glowO:0 0 6px rgba(255,90,60,.9),0 0 18px rgba(224,20,47,.55),0 0 36px rgba(224,20,47,.3);--glowG:0 0 6px rgba(57,255,140,.85),0 0 16px rgba(57,255,140,.5);--glowR:0 0 6px rgba(224,20,47,.9),0 0 18px rgba(224,20,47,.55);--glowTxt:0 0 4px rgba(255,204,51,.9),0 0 14px rgba(224,20,47,.6)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body{background:
 radial-gradient(55% 45% at 15% 0%,rgba(224,20,47,.32),transparent 62%),
 radial-gradient(50% 42% at 100% 8%,rgba(120,8,16,.45),transparent 62%),
 linear-gradient(180deg,#170707,#0a0404 55%,#0f0606);
 background-attachment:fixed}
body.mo{overflow:hidden}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;font-weight:800;letter-spacing:.01em;line-height:1.05}
h2{font-size:26px}h3{font-size:20px}h4{font-size:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;box-shadow:var(--glowY)}
.sub{color:var(--mute);font-size:12.5px}.mute{color:var(--mute)}.good{color:var(--good)}.bad{color:var(--red)}.gold{color:var(--gold)}
.flag{display:inline-flex;vertical-align:-2px;margin-left:3px}.flag svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.crest{position:relative;display:inline-block;flex:none}.crest svg,.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.face{border-radius:50%;flex:none;display:block;background:#123a2d}
.star{background:none;border:0;cursor:pointer;font-size:17px;line-height:1;color:#5b4a63;padding:2px;filter:none;transition:transform .12s}
.star:hover{transform:scale(1.18)}.star.on{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,204,51,.8))}
/* shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-areas:"top top" "tk tk" "side main";min-height:100vh}
.top{grid-area:top;display:flex;align-items:center;gap:18px;padding:10px 18px;background:linear-gradient(100deg,rgba(24,6,8,.95),rgba(40,8,10,.95));border-bottom:2px solid var(--red);position:sticky;top:0;z-index:20;flex-wrap:wrap;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:8px}.logo{position:relative;display:inline-block}.logo svg,.logo img{width:100%;height:100%;display:block}.logo img{position:absolute;inset:0;object-fit:contain}
.bname{font:800 20px/1 var(--f-head);display:flex;flex-direction:column}.bname b{color:var(--gold);font-size:15px}
.tclub{display:flex;align-items:center;gap:9px}.tn{font:800 19px/1 var(--f-head)}.ts{font-size:12px;color:var(--mute)}
.tmgr{display:flex;align-items:center;gap:8px}
.tstat{display:flex;flex-direction:column;line-height:1.15}.tstat b{font:800 17px var(--f-head)}.tstat span{font-size:12px;color:var(--mute)}
.tsp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.pill.open{border-color:var(--good);color:#b9ffd7}.pill.shut{color:var(--mute)}
.ticker{grid-area:tk;overflow:hidden;background:linear-gradient(90deg,rgba(28,7,9,.97),rgba(12,4,5,.97));border-bottom:1px solid var(--line);border-top:1px solid rgba(224,20,47,.3);font-size:13.5px;padding:7px 0;white-space:nowrap}
.tk-track{display:inline-block;animation:tk 90s linear infinite}.ticker:hover .tk-track{animation-play-state:paused}
.tk{display:inline-block;padding-right:56px;color:#ffe3d8}
@keyframes tk{to{transform:translateX(-50%)}}
@keyframes neonPulse{0%,100%{box-shadow:var(--glowY)}50%{box-shadow:0 0 10px rgba(255,204,51,1),0 0 26px rgba(255,204,51,.7),0 0 50px rgba(224,20,47,.5)}}
.side{grid-area:side;background:rgba(10,3,4,.92);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(6px)}
.nav{display:flex;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 12px;border-radius:0 6px 6px 0;cursor:pointer;font-weight:600;color:var(--mute);transition:box-shadow .15s}
.nav:hover{background:var(--panel);color:var(--ink);box-shadow:0 0 10px rgba(224,20,47,.3)}.nav.on{background:var(--panel2);color:var(--ink);border-left-color:var(--gold);box-shadow:inset 0 0 14px rgba(255,204,51,.18)}
.nb{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center}
.main{grid-area:main;padding:20px 22px 60px;min-width:0}
.main>h2{margin-bottom:12px}
/* atoms */
.btn{font-weight:600;font-size:14px;padding:8px 14px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:box-shadow .15s,transform .1s}
.btn:hover{background:var(--raise);box-shadow:0 0 10px rgba(224,20,47,.55);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(100deg,var(--gold),var(--orange));border-color:var(--gold-d);color:#241300;font-weight:700}.btn.gold:hover{box-shadow:0 0 12px rgba(255,204,51,1),0 0 30px rgba(224,20,47,.7);transform:translateY(-1px)}
.btn.sm{padding:4px 10px;font-size:13px}.btn.danger{border-color:var(--red);color:#ffc2d6}.btn.danger:hover{background:rgba(224,20,47,.18);box-shadow:var(--glowR)}.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.lg{padding:12px 22px;font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px;backdrop-filter:blur(3px)}
.card>h3{margin-bottom:10px;padding-left:9px;border-left:4px solid var(--gold);box-shadow:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--mute);font-weight:600}.tab:hover{color:var(--ink)}.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);margin-right:4px}
.chip.bad{border-color:var(--red);color:#ffb4cb}.chip.warn{border-color:var(--orange);color:#ffd28a}.chip.good{border-color:var(--good);color:#9bffce}
.ovr{display:inline-block;min-width:30px;text-align:center;font:800 15px/1 var(--f-head);padding:4px 5px;border-radius:3px;color:#10221b}
.oa{background:var(--gold)}.ob{background:var(--good)}.oc{background:#a6d96a}.od{background:#6fd0e8}.oe{background:#b7a79a}
.pos{display:inline-block;font:700 11px/1 var(--f-body);padding:3px 5px;border-radius:3px;min-width:30px;text-align:center;color:#0d1a14}
.gG{background:#f0a35a}.gD{background:#6db4ea}.gM{background:#7fd6a0}.gA{background:#ef8b80}
.pl,.tl{text-decoration:none;font-weight:600}.pl:hover,.tl:hover{color:var(--gold)}.tl{display:inline-flex;align-items:center;gap:6px}
.pc{display:flex;align-items:center;gap:9px;min-width:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;font-size:12.5px;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#1c0a0c}
.tbl th[data-a]{cursor:pointer}.tbl th[data-a]:hover{color:var(--gold)}
.tbl td{padding:6px 8px;border-bottom:1px solid rgba(210,30,40,.14);vertical-align:middle;white-space:nowrap}
.tbl .n{text-align:right}.tbl tr.me td{background:rgba(79,208,255,.12)}.tbl tr.clk{cursor:pointer;transition:background .12s}.tbl tr.clk:hover td{background:rgba(224,20,47,.14)}
.tbl tr.up td:first-child{box-shadow:inset 4px 0 var(--good)}.tbl tr.dn td:first-child{box-shadow:inset 4px 0 var(--red)}
.form{display:inline-flex;gap:3px}.form i{width:9px;height:9px;border-radius:50%;background:#4a3238}.form i.W{background:var(--good)}.form i.D{background:#c9c3a0}.form i.L{background:var(--red)}
.bar{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--gold)}.bar.g>i{background:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
select,input[type=text],input[type=number]{background:#1a0a0c;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font:inherit}
select:focus,input:focus{box-shadow:0 0 8px rgba(224,20,47,.5)}
input[type=range]{width:100%;accent-color:var(--gold)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field>label{font-size:13px;color:var(--mute);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--mute)}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.al{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);padding:7px 12px;font-size:13.5px;border-radius:4px;cursor:pointer;transition:box-shadow .15s}.al:hover{box-shadow:0 0 12px rgba(255,204,51,.35)}.al.bad{border-left-color:var(--red)}.al.bad:hover{box-shadow:0 0 12px rgba(224,20,47,.3)}.al.good{border-left-color:var(--good)}.al.good:hover{box-shadow:0 0 12px rgba(57,255,140,.25)}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;background:linear-gradient(100deg,rgba(46,14,16,.9),rgba(28,10,11,.9));border:1px solid var(--line);border-radius:6px;padding:22px 20px;margin-bottom:12px}
.hero-t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.hn{font:800 24px/1 var(--f-head)}.hr{font-size:13px;color:var(--mute)}
.hero-m{text-align:center}.hd{font:800 22px/1 var(--f-head);color:var(--gold)}.vs{font:900 44px/1 var(--f-head);margin:4px 0;color:var(--gold)}.hl{font-size:13px;color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
/* news */
.nl{list-style:none;margin:0;padding:0}.nl li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(210,30,40,.14)}.nl .d{color:var(--mute);font-size:12px;min-width:74px;flex:none}
.nl .pic{width:34px;height:34px;border-radius:6px;overflow:hidden;flex:none;background:#000;display:flex;align-items:center;justify-content:center;font-size:16px}
.nl .pic svg,.nl .pic img{width:100%;height:100%;object-fit:cover}
.nl .txt{flex:1;min-width:0}
.nl li.hl{background:rgba(224,20,47,.08);box-shadow:inset 3px 0 var(--red)}
/* tactics */
.pitch{position:relative;aspect-ratio:68/92;max-width:520px;width:100%;margin:0 auto;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(180deg,#1c7a4c 0 10%,#1a7046 10% 20%);border:2px solid var(--gold)}
.pitch::before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 49.7%,rgba(255,255,255,.7) 49.7% 50.3%,#0000 50.3%)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}
.box{position:absolute;left:24%;right:24%;height:15%;border:2px solid rgba(255,255,255,.7)}.box.t{top:0;border-top:0}.box.b{bottom:0;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:78px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2;padding:2px;border-radius:6px}
.slot .sn{font-size:11.5px;font-weight:700;text-shadow:0 1px 2px #000;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.sel{outline:3px solid var(--gold);background:rgba(0,0,0,.25);box-shadow:var(--glowY)}.slot.oop .ovr{outline:2px solid var(--red);box-shadow:var(--glowR)}
.slot .face{border:2px solid #fff}
.lrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-bottom:1px solid rgba(210,30,40,.14);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}.lrow:hover{background:var(--panel2)}.lrow.sel{background:rgba(255,204,51,.16);box-shadow:inset 0 0 10px rgba(255,204,51,.25)}.lrow[disabled]{opacity:.5;cursor:default}
.rbox{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}.rbox>div{background:var(--panel);border:1px solid var(--line);border-radius:4px;text-align:center;padding:7px 4px}.rbox b{display:block;font:800 24px/1 var(--f-head);color:var(--gold)}.rbox span{font-size:12px;color:var(--mute)}
/* modal — popups get the neon treatment */
.mback{position:fixed;inset:0;background:rgba(4,1,2,.86);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:4vh 12px;backdrop-filter:blur(2px)}
.modal{background:#160607;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:6px;width:100%;max-width:760px;padding:18px 20px 20px;position:relative;margin-bottom:5vh;box-shadow:0 0 40px rgba(224,20,47,.35),0 0 90px rgba(224,20,47,.15)}
.modal.sm{max-width:480px}.modal.lg{max-width:940px}
.mx{position:absolute;right:10px;top:8px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--mute);line-height:1}.mx:hover{color:var(--gold);text-shadow:var(--glowTxt)}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.att{display:grid;grid-template-columns:34px 1fr 26px;gap:5px 8px;align-items:center;font-size:13px}.att b{color:var(--mute);font-weight:600}
#toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1a0a0c;color:var(--gold);border:1px solid var(--gold);padding:9px 16px;border-radius:4px;font-weight:600;box-shadow:var(--glowY);max-width:90vw}.toast.bad{background:#260a0e;color:#ff9fbd;border-color:var(--red);box-shadow:var(--glowR)}.toast.good{background:#08211a;color:#8dffc4;border-color:var(--good);box-shadow:var(--glowG)}
/* start */
.start{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);align-items:stretch}
.start-l{padding:8vh 6vw;display:flex;flex-direction:column;justify-content:center;gap:16px;background:radial-gradient(120% 90% at 20% 20%,rgba(224,20,47,.35),transparent 55%),radial-gradient(90% 70% at 90% 90%,rgba(120,8,16,.35),transparent 60%),#150707;border-right:2px solid var(--red)}
.start-l h1{font-size:clamp(46px,7vw,92px);line-height:.92;color:#fff}.start-l h1 b{color:var(--gold);display:block}
.start-l p{max-width:46ch;color:#dcc3bf;font-size:17px}
.start-r{padding:6vh 32px;background:#0d0505;overflow-y:auto}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.av{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute);transition:box-shadow .15s}.av:hover{box-shadow:0 0 10px rgba(224,20,47,.4)}.av.on{border-color:var(--gold);color:var(--ink);box-shadow:var(--glowY)}
.clubpick{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--gold);border-radius:6px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--glowY)}
/* live */
.live{position:fixed;inset:0;z-index:60;background:#090304;overflow-y:auto;padding:12px 14px 30px}
.lv{max-width:1100px;margin:0 auto}
.lv-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:8px}
.lv-t{display:flex;align-items:center;gap:10px;font:800 22px var(--f-head)}.lv-t.r{justify-content:flex-end;text-align:right}
.lv-sc{text-align:center}.lv-sc b{font:900 46px/1 var(--f-head);display:block;color:var(--gold)}.lv-sc span{font:700 16px var(--f-head);color:var(--orange)}
canvas.lvc{width:100%;height:auto;display:block;border:2px solid var(--gold);border-radius:6px;background:#1a7046}
.lv-c{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lv-feed{max-height:190px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}.lv-feed div{padding:3px 0;border-bottom:1px solid rgba(210,30,40,.14)}.lv-feed .g{color:var(--gold);font-weight:700;text-shadow:var(--glowTxt)}
.banner{background:linear-gradient(100deg,var(--gold),var(--orange));color:#241300;font:800 22px var(--f-head);padding:6px 12px;border-radius:4px;text-align:center;margin:8px 0;box-shadow:var(--glowY);animation:neonPulse 1.6s ease-in-out infinite}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .h{font-size:12px;color:var(--mute);text-align:center;padding:3px}
.cd{min-height:78px;background:var(--panel);border:1px solid rgba(210,30,40,.25);border-radius:4px;padding:4px 5px;font-size:12px;overflow:hidden}.cd.win{background:rgba(57,255,140,.1);border-color:rgba(57,255,140,.35)}.cd.today{outline:2px solid var(--gold)}.cd.x{opacity:.35}.cd .dn{font-weight:700;color:var(--mute)}
.cd .m{display:block;margin-top:2px;padding:2px 4px;border-radius:3px;background:var(--gold);color:#241c00;font-weight:600;line-height:1.2}.cd .m.h{background:var(--orange);color:#241300}
.sp{width:100%;height:auto}
.seas-bar{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}.seas-bar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;height:100%}.seas-bar i{display:block;width:70%;min-height:3px;border-radius:2px 2px 0 0}
/* watchlist */
.wl-row{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid rgba(210,30,40,.14)}
.wl-empty{padding:18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:6px}
@media (max-width:900px){
.shell{grid-template-columns:1fr;grid-template-areas:"top" "tk" "side" "main"}
.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:4px}.nav{border-left:0;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;gap:6px}.nav.on{border-bottom-color:var(--gold)}
.top{position:static;gap:10px}.tsp{display:none}.main{padding:14px 12px 60px}
.grid2,.grid3{grid-template-columns:1fr}.hero{grid-template-columns:1fr;text-align:center}.start{grid-template-columns:1fr}.start-l{border-right:0;border-bottom:2px solid var(--red);padding:5vh 6vw}
.rbox{grid-template-columns:repeat(5,1fr)}.lv-t{font-size:16px}
}
@media (max-width:520px){.tmgr .tstat,.brand .bname{display:none}.avs{grid-template-columns:repeat(4,1fr)}.slot{width:62px}.slot .sn{font-size:10px;max-width:62px}.slot .face{width:34px;height:34px}}
@media (prefers-reduced-motion:reduce){.tk-track{animation:none;white-space:normal}.ticker{white-space:normal}.banner{animation:none}}
</style>

/* ---------- lineups ---------- */
const WA={ST:1,CF:1,RM:.7,LM:.7,CM:.35,CDM:.1},WM={CM:1,CDM:1,RM:.5,LM:.5,CF:.2,ST:.1},WD={CB:1,RB:.8,LB:.8,CDM:.5,CM:.15};
function calcPow(sd){let a=0,aw=0,m=0,mw=0,d=0,dw=0,gk=45;
 for(let i=0;i<sd.xi.length;i++){const id=sd.xi[i];if(!id)continue;const p=P(id),s=sd.slots[i],e=p.ovr*fitv(p.pos,s);
  if(s==='GK'){gk=e;continue;}if(WA[s]){a+=WA[s]*e;aw+=WA[s];}if(WM[s]){m+=WM[s]*e;mw+=WM[s];}if(WD[s]){d+=WD[s]*e;dw+=WD[s];}}
 const pen=1-.06*(sd.reds||0);return {att:(aw?a/aw:40)*pen,mid:(mw?m/mw:40)*pen,def:(dw?d/dw:40)*pen,gk};}
function ratingOf(t){const slots=slotsOf(t.formation),pw=calcPow({xi:t.xi,slots,reds:0});let s=0,n=0;
 t.xi.forEach((id,i)=>{if(id){s+=P(id).ovr*fitv(P(id).pos,slots[i]);n++;}});
 return {ovr:Math.round(n?s/n:40),att:Math.round(pw.att),mid:Math.round(pw.mid),def:Math.round(pw.def),gk:Math.round(pw.gk)};}
function autoPick(t){const ids=t.squad.filter(id=>!P(id).inj),slots=slotsOf(t.formation),pairs=[];
 for(const id of ids){const p=P(id);for(let s=0;s<11;s++)pairs.push([p.ovr*fitv(p.pos,slots[s]),id,s]);}
 pairs.sort((x,y)=>y[0]-x[0]);const xi=Array(11).fill(null),used=new Set();
 for(const [e,id,s] of pairs){if(xi[s]!==null||used.has(id))continue;xi[s]=id;used.add(id);}
 if(xi.some(x=>x===null)){for(let s=0;s<11;s++)if(!xi[s]){const c=t.squad.find(id=>!used.has(id));if(c){xi[s]=c;used.add(c);}}}
 const rest=t.squad.filter(id=>!used.has(id)&&!P(id).inj).sort((a,b)=>P(b).ovr-P(a).ovr),bench=[];
 const gi=rest.findIndex(id=>P(id).pos==='GK');if(gi>=0)bench.push(rest.splice(gi,1)[0]);
 while(bench.length<7&&rest.length)bench.push(rest.shift());
 t.xi=xi;t.bench=bench;}
function fixLineup(t){const sq=new Set(t.squad),slots=slotsOf(t.formation);t.xi=(t.xi||[]).slice(0,11);while(t.xi.length<11)t.xi.push(null);const seen=new Set();
 for(let i=0;i<11;i++){const id=t.xi[i],p=id&&P(id);if(!p||!sq.has(id)||p.inj||seen.has(id))t.xi[i]=null;else seen.add(id);}
 t.bench=[...new Set((t.bench||[]).filter(id=>sq.has(id)&&!seen.has(id)&&P(id)&&!P(id).inj))];
 for(let i=0;i<11;i++)if(!t.xi[i]){const pool=t.squad.filter(id=>!seen.has(id)&&!P(id).inj).sort((a,b)=>P(b).ovr*fitv(P(b).pos,slots[i])-P(a).ovr*fitv(P(a).pos,slots[i]));
  const c=pool[0]||t.squad.find(id=>!seen.has(id));if(c){t.xi[i]=c;seen.add(c);}}
 t.bench=t.bench.filter(id=>!seen.has(id));
 if(t.bench.length<7){const rest=t.squad.filter(id=>!seen.has(id)&&!t.bench.includes(id)&&!P(id).inj).sort((a,b)=>P(b).ovr-P(a).ovr);
  if(!t.bench.some(id=>P(id).pos==='GK')){const g=rest.findIndex(id=>P(id).pos==='GK');if(g>=0)t.bench.push(rest.splice(g,1)[0]);}
  while(t.bench.length<7&&rest.length)t.bench.push(rest.shift());}
 t.bench=t.bench.slice(0,7);t.r=ratingOf(t);}
function prep(t){if(t.user)fixLineup(t);else{autoPick(t);t.r=ratingOf(t);}}
function setFormation(t,f){t.formation=f;autoPick(t);t.r=ratingOf(t);}

const NEWS_ICON={tr:'🔁',yth:'🌱',ret:'👋',win:'🏆',inj:'🩹',res:'⚽',fin:'💰',sys:'📣',up:'⬆️',dn:'⬇️'};
/* picture for a news item: {p:playerId} shows the player's face, {t:teamId} shows the club crest, else a colored icon glyph */
function newsPic(n){const pic=n.pic;if(pic&&pic.p&&P(pic.p))return `<span class="pic">${face(P(pic.p).f,'#3a2a2c',34)}</span>`;

/* ---------- fixtures ---------- */
function makeRounds(ids){const arr=ids.slice(),m=arr.length,rounds=[];
 for(let r=0;r<m-1;r++){const rd=[];for(let i=0;i<m/2;i++){let h=arr[i],a=arr[m-1-i];if((i===0&&r%2)||(i>0&&(r+i)%2))[h,a]=[a,h];rd.push([h,a]);}rounds.push(rd);arr.splice(1,0,arr.pop());}
 R.sh(rounds);return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])));}
function seasonDates(y){const start=y+'-08-01',out=[];for(let i=0;i<30;i++){let d=addD(start,Math.round(i*9.6));while([1,2,3,4,5].includes(dt(d).getUTCDay()))d=addD(d,1);out.push(d);}return out;}
const trow=()=>({p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]});
function makeSeason(){G.dates=seasonDates(G.year);G.round=0;
 for(const tier of [1,2,3,4]){const ids=Object.values(G.teams).filter(t=>t.tier===tier).map(t=>t.id);R.sh(ids);
  const rounds=makeRounds(ids);G.lg[tier]={teams:ids,rounds,res:rounds.map(()=>[]),tab:{}};ids.forEach(id=>{G.lg[tier].tab[id]=trow();T(id).tb=Math.random();T(id).pos=0;});}}
function standings(tier){const lg=G.lg[tier];return lg.teams.map(id=>[id,lg.tab[id]]).sort((a,b)=>b[1].pts-a[1].pts||(b[1].gf-b[1].ga)-(a[1].gf-a[1].ga)||b[1].gf-a[1].gf||T(b[0]).tb-T(a[0]).tb);}

/* ---------- match engine ---------- */
const CH={base:.108,qe:1.85,conv:.105,ce:1.7};
const WSH={GK:.003,CB:.5,RB:.35,LB:.35,CDM:.6,CM:1.2,RM:1.6,LM:1.6,ST:2.8,CF:3},WAS={GK:0,CB:.4,RB:.8,LB:.8,CDM:.8,CM:2,RM:2.2,LM:2.2,ST:1.4,CF:1.4};
function mkSide(t){return {tid:t.id,xi:t.xi.slice(),bench:t.bench.slice(),slots:slotsOf(t.formation),form:t.formation,reds:0,subs:0,yel:{},apps:new Set(t.xi.filter(Boolean))};}
function newMatch(hid,aid,manual){const H=T(hid),A=T(aid);prep(H);prep(A);
 return {h:hid,a:aid,hs:0,as:0,min:0,ev:[],goals:[],side:{h:mkSide(H),a:mkSide(A)},ph:0,sh:{h:0,a:0},sot:{h:0,a:0},inj:{},verbose:!!manual,dirty:true,manual:{h:!!(manual&&H.user),a:!!(manual&&A.user)},user:{h:!!H.user,a:!!A.user},done:false,poss:'h'};}
function pickXI(S,w){let tot=0;const ws=S.xi.map((id,i)=>{if(!id)return 0;const x=w[S.slots[i]]==null?1:w[S.slots[i]];tot+=x;return x;});if(tot<=0)return -1;let x=Math.random()*tot;for(let i=0;i<11;i++){x-=ws[i];if(x<=0&&ws[i]>0)return i;}return ws.findIndex(v=>v>0);}
function doSub(m,sd,i,inId){const S=m.side[sd],out=S.xi[i];S.xi[i]=inId;S.bench=S.bench.filter(x=>x!==inId);S.subs++;S.apps.add(inId);m.ev.push({t:m.min,ty:'sub',sd,o:out,p:inId});m.dirty=true;}
function bestBenchFor(S,pos,exclGK){const g=GRP[pos];const c=S.bench.filter(id=>!(exclGK&&P(id).pos==='GK')&&(pos==='GK'?P(id).pos==='GK':P(id).pos!=='GK'));
 c.sort((a,b)=>(P(b).ovr*fitv(P(b).pos,pos)+(GRP[P(b).pos]===g?3:0))-(P(a).ovr*fitv(P(a).pos,pos)+(GRP[P(a).pos]===g?3:0)));return c[0]||null;}
function shoot(m,sd,mi,D){const S=m.side[sd];let tot=0;const ws=S.xi.map((id,i)=>{if(!id)return 0;const p=P(id),w=(WSH[S.slots[i]]||1)*Math.pow(p.ovr*fitv(p.pos,S.slots[i])/70,2);tot+=w;return w;});
 let x=Math.random()*tot,si=0;for(;si<11;si++){x-=ws[si];if(x<=0&&ws[si]>0)break;}if(si>10||!S.xi[si])si=ws.findIndex(v=>v>0);
 const sp=P(S.xi[si]),se=sp.ovr*fitv(sp.pos,S.slots[si]),pg=clamp(CH.conv*Math.pow(se/D.gk,CH.ce),.02,.4);m.sh[sd]++;
 if(Math.random()<pg){let ast=null;
  if(Math.random()<.68){let t2=0;const w2=S.xi.map((id,i)=>{if(!id||i===si)return 0;const w=WAS[S.slots[i]]*Math.pow(P(id).ovr/70,2);t2+=w;return w;});
   if(t2>0){let y=Math.random()*t2,j=0;for(;j<11;j++){y-=w2[j];if(y<=0&&w2[j]>0)break;}if(j<=10&&S.xi[j])ast=S.xi[j];}}
  if(sd==='h')m.hs++;else m.as++;m.sot[sd]++;m.goals.push({t:mi,p:sp.id,side:sd,a:ast});m.ev.push({t:mi,ty:'goal',sd,p:sp.id,a:ast,s:m.hs+'-'+m.as});}
 else{if(Math.random()<.5){m.sot[sd]++;if(m.verbose)m.ev.push({t:mi,ty:'save',sd,p:sp.id});}else if(m.verbose)m.ev.push({t:mi,ty:'miss',sd,p:sp.id});}}
function stepMin(m){m.min++;const mi=m.min;
 if(m.dirty){m.pw={h:calcPow(m.side.h),a:calcPow(m.side.a)};m.dirty=false;}
 const H=m.pw.h,A=m.pw.a,ha=1.055,mh=H.mid*ha,ph=mh/(mh+A.mid);m.ph+=ph;m.poss=Math.random()<ph?'h':'a';
 for(const sd of ['h','a']){const O=sd==='h'?H:A,D=sd==='h'?A:H,adv=sd==='h'?ha:1,share=sd==='h'?ph:1-ph;
  const pc=clamp(CH.base*Math.pow(O.att*adv/D.def,CH.qe)*(.55+.9*share),.01,.4);if(Math.random()<pc)shoot(m,sd,mi,D);}
 for(const sd of ['h','a']){const S=m.side[sd];
  if(Math.random()<.0038){const i=pickXI(S,{CB:1.6,CDM:1.6,RB:1.2,LB:1.2,CM:1,RM:.8,LM:.8,ST:.7,CF:.7,GK:.2});if(i>=0){const id=S.xi[i];if(S.yel[id]){m.ev.push({t:mi,ty:'yel2',sd,p:id});S.xi[i]=null;S.reds++;m.dirty=true;}else{S.yel[id]=1;m.ev.push({t:mi,ty:'yel',sd,p:id});}}}
  if(Math.random()<.00018){const i=pickXI(S,{GK:.2});if(i>=0){m.ev.push({t:mi,ty:'red',sd,p:S.xi[i]});S.xi[i]=null;S.reds++;m.dirty=true;}}
  if(Math.random()<.0009){const i=pickXI(S,{GK:.3});if(i>=0){const id=S.xi[i];m.inj[id]=R.c(.08)?R.i(9,20):R.i(1,8);m.ev.push({t:mi,ty:'inj',sd,p:id});
   const b=S.subs<5?bestBenchFor(S,S.slots[i],false):null;if(b)doSub(m,sd,i,b);else{S.xi[i]=null;S.reds++;m.dirty=true;}}}
  if(mi>=56&&mi<=82&&!m.manual[sd]&&S.subs<3&&Math.random()<.09){const i=pickXI(S,{GK:0,CB:1,RB:1,LB:1,CDM:1,CM:1.2,RM:1.3,LM:1.3,ST:1.4,CF:1.4});if(i>=0){const b=bestBenchFor(S,S.slots[i],true);if(b)doSub(m,sd,i,b);}}}
 if(mi>=90)m.done=true;}
function autoplay(m){while(m.min<90)stepMin(m);}
function userSub(m,sd,idx,inId){const S=m.side[sd];if(S.subs>=5||!S.bench.includes(inId)||!S.xi[idx])return false;doSub(m,sd,idx,inId);return true;}
function finishMatch(m){const res={};
 for(const sd of ['h','a']){const S=m.side[sd],opp=sd==='h'?m.as:m.hs,own=sd==='h'?m.hs:m.as,w=own>opp?.3:own<opp?-.3:0,on=new Set(S.xi.filter(Boolean));
  for(const id of S.apps){const p=P(id);let g=0,a=0;for(const x of m.goals){if(x.p===id)g++;if(x.a===id)a++;}
   let r=6.2+R.g()*.55+w+g*1.1+a*.6;if(opp===0&&on.has(id)&&['GK','CB','RB','LB','CDM'].includes(p.pos))r+=.5;r=clamp(r,4.2,10);
   p.st.a++;p.st.g+=g;p.st.as+=a;p.st.r+=r;res[id]=r;if(p.pos==='GK'&&opp===0&&on.has(id))p.st.cs++;}}
 for(const id in m.inj)P(id).inj=m.inj[id];
 m.motm=Object.keys(res).sort((a,b)=>res[b]-res[a])[0];m.rat=res;m.done=true;return m;}
function recordMatch(tier,r,m){const lg=G.lg[tier],isU=m.user.h||m.user.a;
 const rec={h:m.h,a:m.a,hs:m.hs,as:m.as,g:m.goals.map(g=>[g.t,g.p,g.side,g.a||0]),sh:[m.sh.h,m.sh.a],sot:[m.sot.h,m.sot.a],po:Math.round(m.ph/Math.max(1,m.min)*100),mo:m.motm};
 if(isU){rec.ev=m.ev.filter(e=>['goal','yel','yel2','red','sub','inj'].includes(e.ty));rec.rt=m.rat;}
 lg.res[r].push(rec);
 const upd=(id,gf,ga)=>{const x=lg.tab[id];x.p++;x.gf+=gf;x.ga+=ga;const c=gf>ga?'W':gf<ga?'L':'D';if(c==='W'){x.w++;x.pts+=3;}else if(c==='D'){x.d++;x.pts++;}else x.l++;x.form.push(c);if(x.form.length>6)x.form.shift();};
 upd(m.h,m.hs,m.as);upd(m.a,m.as,m.hs);
 const H=T(m.h),A=T(m.a),gate=H.fans*H.tp*R.f(.8,1.2)*(.9+.2*A.fans/H.fans>1.15?1.15:1);H.fin.inc.gate+=gate;H.bud+=gate;
 if(tier<=2){const cnt={};for(const g of m.goals)cnt[g.p]=(cnt[g.p]||0)+1;for(const id in cnt)if(cnt[id]>=3)news('res',`Hat-trick! ${pfull(P(id))} scores ${cnt[id]} for ${T(P(id).tm).name} in a ${m.hs}-${m.as} ${m.hs>m.as&&P(id).tm===m.h||m.as>m.hs&&P(id).tm===m.a?'win':'game'}.`,{p:id});
  const dif=H.str-A.str;if(tier===1&&((m.hs>m.as&&dif<=-12)||(m.as>m.hs&&dif>=12)))news('res',`Shock result: ${m.hs>m.as?H.name:A.name} beat ${m.hs>m.as?A.name:H.name} ${Math.max(m.hs,m.as)}-${Math.min(m.hs,m.as)}.`,{t:m.hs>m.as?m.h:m.a});}
 if(isU){const u=m.user.h?H:A,pl=m.rat?Object.keys(m.rat):[];for(const id in m.inj)if(P(id).tm===u.id)news('inj',`${pfull(P(id))} injured — out for ${m.inj[id]} match${m.inj[id]>1?'es':''}.`,{p:id});}}

function accrue(to){const days=diffD(G.payDate,to);if(days<=0)return;
 for(const t of Object.values(G.teams)){const w=monthly(t)*days/30.4,s=t.rev*days/365,ac=t.acLvl*1800*days/30.4;t.fin.exp.wages+=w;t.fin.inc.spons+=s;t.fin.exp.acad+=ac;t.bud+=s-w-ac;
  for(const id of t.squad){P(id).earn+=P(id).wage*days/30.4;}}
 G.payDate=to;}
const PRIZE_BASE=[10e6,6.5e6,5e6,4e6,3.2e6,2.7e6,2.3e6,2e6,1.8e6,1.6e6,1.4e6,1.3e6,1.2e6,1.1e6,1e6,.9e6],PRIZE_SC=[1,.06,.015,.004];

function moveP(pid,toId,fee,wage,yrs,silent){const p=P(pid),from=p.tm?T(p.tm):null,to=toId?T(toId):null;
 if(from&&(p.st.a>0)){p.ca.push({y:seasonLabel(),tm:from.name,lg:from.tier,a:p.st.a,g:p.st.g,as:p.st.as,r:+(p.st.r/p.st.a).toFixed(2),ovr:p.ovr,part:1});p.st={a:0,g:0,as:0,cs:0,r:0};}
 if(from){from.squad=from.squad.filter(x=>x!==pid);from.acad=from.acad.filter(x=>x!==pid);from.xi=from.xi.map(x=>x===pid?null:x);from.bench=from.bench.filter(x=>x!==pid);}
 G.fa=G.fa.filter(x=>x!==pid);p.sale=0;G.bids=G.bids.filter(b=>b.pid!==pid);
 if(to){to.squad.push(pid);p.tm=to.id;p.y=0;p.wage=wage;p.exp=G.year+yrs;p.fee=fee;p.joined=G.date;
  if(fee){if(from){from.bud+=fee;from.fin.inc.sales+=fee;}to.bud-=fee;to.fin.exp.buys+=fee;}}
 else{p.tm=null;p.y=0;p.wage=wageFor(p.ovr,p.age)*R.f(.7,1);G.fa.push(pid);}
 G.tx.unshift({d:G.date,pid,n:pfull(p),pos:p.pos,age:p.age,ovr:p.ovr,from:from?from.name:'Free agent',to:to?to.name:'Free agent',fee,fid:from?from.id:null,tid:to?to.id:null});if(G.tx.length>400)G.tx.length=400;
 if(from)prep(from);if(to)prep(to);}
function starterAt(t,pos){const n=slotsOf(t.formation).filter(s=>s===pos).length||1;const a=t.squad.map(P).filter(p=>p.pos===pos).map(p=>p.ovr).sort((x,y)=>y-x);return a.length>=n?a[n-1]:0;}
function interested(p,n){n=n||4;const ptier=p.tm?T(p.tm).tier:3,vv=pVal(p),out=[];
 for(const t of Object.values(G.teams)){if(t.id===p.tm||t.squad.length>=31)continue;if(t.tier>ptier+1||t.tier<ptier-2)continue;if(t.bud<vv*.5)continue;const d=p.ovr-starterAt(t,p.pos);if(d<1)continue;
  if(p.nat!=='ZA'&&foreignCount(t)>=5)continue;if(p.ovr-t.r.ovr>=15)continue;out.push({t,s:d+(t.tier<ptier?2:0)-(t.tier>ptier?3:0)+hashS(p.id+t.id)});}
 return out.sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.t);}
function askPrice(p){const t=T(p.tm);let a=pVal(p);const rank=t.squad.map(id=>P(id).ovr).sort((x,y)=>y-x).indexOf(p.ovr);if(rank>=0&&rank<3)a*=1.3;if(p.sale)a*=.9;return roundMoney(a*t.am);}
function wageReq(p,buyer){const cur=p.tm?T(p.tm):null;let req=wageFor(p.ovr,p.age);const dtr=cur?buyer.tier-cur.tier:0;if(dtr>0)req*=1+.3*dtr;

 let f;if(key==='g')f=p=>p.st.g;else if(key==='as')f=p=>p.st.as;else if(key==='cs')f=p=>p.st.cs;else if(key==='r')f=p=>p.st.a>=5?p.st.r/p.st.a:0;else f=p=>p.st.a?p.pot:0;
 const arr=key==='u21'?out.filter(p=>p.age<=21):out;return arr.filter(p=>f(p)>0).sort((a,b)=>f(b)-f(a)||b.ovr-a.ovr).slice(0,n||15);}
function careerTotals(p){let a=p.st.a,g=p.st.g,as=p.st.as;for(const c of p.ca){a+=c.a;g+=c.g;as+=c.as;}return {a,g,as};}
/* ---------- save / load ---------- */
const SAVE_KEY='mzansiManager2026.save';
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));localStorage.setItem(SAVE_KEY+'.meta',JSON.stringify({c:G.user,n:G.mgr.name,d:G.date,y:G.year}));return true;}catch(e){return false;}}
function saveMeta(){try{return JSON.parse(localStorage.getItem(SAVE_KEY+'.meta'));}catch(e){return null;}}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;const g=JSON.parse(s);if(!g||g.v!==3)return false;G=g;if(!G.watch)G.watch=[];_pid=1+Math.max(0,...Object.keys(G.players).map(k=>+k.slice(1)||0),...G.bids.map(b=>+b.id.slice(1)||0));return true;}catch(e){return false;}}
/* ---------- watchlist ("keep an eye") ---------- */
const isWatched=pid=>G.watch.includes(pid);
function toggleWatch(pid){if(!G.watch)G.watch=[];const i=G.watch.indexOf(pid);if(i>=0){G.watch.splice(i,1);return false;}G.watch.push(pid);return true;}

 const rows=st.map(([id,r],i)=>({id,r,i})).filter(x=>!ids||ids.includes(x.id));

 <div class="card"><h3>Interested clubs</h3>${intr.length?intr.map(x=>`<div style="margin-bottom:5px">${tlink(x,x.name,18)} <span class="sub">${LEAGUE_SHORT[x.tier]}</span></div>`).join(''):'<div class="sub">No clubs are showing interest right now.</div>'}</div>

INP.ofee=v=>{UI.offer.fee=+v;$('#o-fee').textContent=fm(+v);};INP.owage=v=>{UI.offer.wage=+v;$('#o-wage').textContent=fm(+v);};INP.oyrs=v=>{UI.offer.yrs=+v;$('#o-yrs').textContent=v+(+v>1?' years':' year');};
ACT.offer=v=>{const p=P(v),u=T(G.user);if(p.tm&&!winInfo().open){toast('The transfer window is closed. You can still sign free agents.','bad');return;}
 UI.offer={pid:v,ask:p.tm?askPrice(p):0,fee:p.tm?askPrice(p):0,wage:wageReq(p,u).req,yrs:3,msg:'',ok:false};const f=()=>offerModal();f.cls='sm';openM(f);};

function renewModal(){const o=UI.renew,p=P(o.pid),req=Math.round(wageFor(p.ovr,p.age)*1.05/500)*500,wmin=Math.round(req*.6/500)*500,wmax=Math.round(req*2.2/500)*500;

VIEWS.finance=()=>{const u=T(G.user),inc=u.fin.inc,ex=u.fin.exp,ti=Object.values(inc).reduce((a,b)=>a+b,0),te=Object.values(ex).reduce((a,b)=>a+b,0),net=ti-te;
 const hist=u.finHist.slice(-8).map(h=>({y:h.y,net:h.net})).concat([{y:seasonLabel()+' so far',net}]),mx=Math.max(1,...hist.map(h=>Math.abs(h.net)));

 <div class="card"><h3>Profit and loss by season</h3><div class="seas-bar">${hist.map(h=>`<div title="${h.y}: ${fm(h.net)}"><span class="${h.net>=0?'good':'bad'}">${h.net>=0?'':'−'}${fm(Math.abs(h.net))}</span><i style="height:${Math.max(3,Math.abs(h.net)/mx*80)}px;background:${h.net>=0?'var(--good)':'var(--red)'}"></i><span class="sub">${h.y.replace(' so far','*')}</span></div>`).join('')}</div><p class="sub">* the current season, still in progress.</p></div></div>

/* ---------- calendar ---------- */
const p2=n=>String(n).padStart(2,'0');
VIEWS.calendar=()=>{const u=T(G.user);if(!UI.cal)UI.cal=G.date.slice(0,7);const [Y,M]=UI.cal.split('-').map(Number),dow=new Date(Date.UTC(Y,M-1,1,12)).getUTCDay(),dim=new Date(Date.UTC(Y,M,0,12)).getUTCDate();
 const fx={};G.dates.forEach((d,i)=>{const f=G.lg[u.tier].rounds[i].find(x=>x[0]===u.id||x[1]===u.id),rec=G.lg[u.tier].res[i].find(x=>x.h===u.id||x.a===u.id);fx[d]={i,f,rec};});
 const winM=M===7||M===8||M===1;let cells='';for(let i=0;i<dow;i++)cells+='<div></div>';
 for(let d=1;d<=dim;d++){const iso=`${Y}-${p2(M)}-${p2(d)}`,x=fx[iso];let m='';
  if(x){const H=x.f[0]===u.id,opp=T(H?x.f[1]:x.f[0]);m=`<span class="m ${H?'h':''}">${H?'v':'@'} ${esc(opp.s)}${x.rec?' '+x.rec.hs+'-'+x.rec.as:''}</span>`;}
  if(iso===(G.year+1)+'-06-30')m+='<span class="sub">Season ends</span>';if(iso===G.year+'-07-01'||iso===(G.year+1)+'-07-01')m+='<span class="sub">Pre-season</span>';
  cells+=`<div class="cd ${winM?'win':''} ${iso===G.date?'today':''}"><span class="dn">${d}</span>${m}</div>`;}
 const up=G.round<30?G.dates.slice(G.round,G.round+6).map((d,k)=>{const f=G.lg[u.tier].rounds[G.round+k].find(x=>x[0]===u.id||x[1]===u.id),H=f[0]===u.id,o=T(H?f[1]:f[0]);return `<tr><td>${fday(d)} ${fdate(d,1)}</td><td>${H?'Home':'Away'}</td><td>${crest(o,14)} ${esc(o.name)}</td><td class="n">${o.r.ovr}</td></tr>`;}).join(''):'';

 case 'save':return `<div>🧤 ${e.t}' ${esc(pname(pl))} shoots and it is saved.</div>`;case 'miss':return `<div>${e.t}' ${esc(pname(pl))} shoots wide.</div>`;
 case 'yel':return `<div>🟨 ${e.t}' Yellow card for ${esc(nm)} (${esc(tm.s)}).</div>`;case 'yel2':return `<div class="bad">🟥 ${e.t}' Second yellow. ${esc(nm)} (${esc(tm.s)}) is sent off.</div>`;

function lvDraw(ts){const L=LIVE;if(!L)return;const cv=$('#lvc');if(!cv)return;const c=cv.getContext('2d'),W=cv.width,Hh=cv.height,m=L.m;
 c.fillStyle='#1a7046';c.fillRect(0,0,W,Hh);for(let i=0;i<10;i++){if(i%2){c.fillStyle='#1c7a4b';c.fillRect(i*W/10,0,W/10,Hh);}}
 c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=3;c.strokeRect(14,14,W-28,Hh-28);c.beginPath();c.moveTo(W/2,14);c.lineTo(W/2,Hh-14);c.stroke();c.beginPath();c.arc(W/2,Hh/2,70,0,7);c.stroke();
 c.strokeRect(14,Hh/2-150,150,300);c.strokeRect(W-164,Hh/2-150,150,300);c.strokeRect(14,Hh/2-70,55,140);c.strokeRect(W-69,Hh/2-70,55,140);
 const b=L.ball;b.x+=(b.tx-b.x)*.1;b.y+=(b.ty-b.y)*.1;const shift=(b.x-.5)*.34;
 for(const sd of ['h','a']){const S=m.side[sd],xy=slotXY(S.form),col=sd==='h'?L.ch:L.ca,home=sd==='h';

   const q=L.pos[id]||(L.pos[id]={x:tx,y:ty});q.x+=(tx-q.x)*.06;q.y+=(ty-q.y)*.06;
   const px=q.x*W,py=q.y*Hh,gk=S.slots[i]==='GK';c.beginPath();c.arc(px,py,12,0,7);c.fillStyle=gk?(home?'#ff9f43':'#5f27cd'):col;c.fill();c.lineWidth=2.5;c.strokeStyle=(S.tid===G.user)?'#f5b800':'#fff';c.stroke();

 c.beginPath();c.arc(b.x*W,b.y*Hh,7,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle='#111';c.stroke();
